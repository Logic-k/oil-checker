name: oil_checker
description: "가장 경제적인 주유소를 자동으로 찾아주는 앱 - 기름값을 금값처럼!"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 상태관리
  flutter_riverpod: ^3.0.0
  # 로컬 DB (주유소 캐시, 차량 프로필, 주유이력)
  # sqlite3 ^3.x: hooks로 네이티브 바이너리 자동 번들 → sqlite3_flutter_libs 불필요
  drift: ^2.34.0
  path_provider: ^2.1.5
  path: ^1.9.0
  # 네트워크
  dio: ^5.7.0
  # 좌표변환 (WGS84 ↔ KATEC)
  proj4dart: ^3.0.0
  # 위치
  geolocator: ^14.0.0
  # 지도 (무료 OSM 기반, Kakao 교체 가능 구조)
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  # CSV 파싱 (연비 데이터)
  csv: ^8.0.0
  drift_flutter: ^0.3.1
  # 모션 — Material motion 패턴(OpenContainer/FadeThrough/SharedAxis)
  # 3.0.0은 Dart 3.12 필요 — 현 SDK 3.11이므로 2.x 라인 고정
  animations: ^2.2.0
  # 지도 카메라/마커 애니메이션 (flutter_map v8 호환)
  flutter_map_animations: ^0.10.0
  # 네이티브+웹 스플래시 (preserve/remove로 첫 프레임 제어)
  flutter_native_splash: ^2.4.7
  maplibre_gl: ^0.27.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Drift 코드 생성
  drift_dev: ^2.34.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/data/car_fuel_economy.csv
    - assets/data/fuel_tank_capacity.csv
    - assets/data/car_image_map.csv
    - assets/cars/
    - assets/brand/icon-512.png

# 네이티브/웹 스플래시 — ink 배경 + 브랜드 아이콘
# main.dart의 FlutterNativeSplash.preserve/remove와 짝을 이룬다
flutter_native_splash:
  color: "#12181F"
  image: assets/brand/icon-512.png
  color_dark: "#0B1016"
  image_dark: assets/brand/icon-512.png
  web: true
  android: true
  ios: false

