name: oil_checker
description: "가장 경제적인 주유소를 자동으로 찾아주는 앱 - 기름값을 금값처럼!"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 상태관리
  flutter_riverpod: ^3.0.0
  # 로컬 DB (주유소 캐시, 차량 프로필, 주유이력)
  # sqlite3 ^3.x: hooks로 네이티브 바이너리 자동 번들 → sqlite3_flutter_libs 불필요
  drift: ^2.34.0
  path_provider: ^2.1.5
  path: ^1.9.0
  # 네트워크
  dio: ^5.7.0
  # 좌표변환 (WGS84 ↔ KATEC)
  proj4dart: ^2.1.0
  # 위치
  geolocator: ^13.0.2
  # 지도 (무료 OSM 기반, Kakao 교체 가능 구조)
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  # CSV 파싱 (연비 데이터)
  csv: ^6.0.0
  drift_flutter: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Drift 코드 생성
  drift_dev: ^2.34.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/data/car_fuel_economy.csv

